services:
  web:
    build: ./backend
    command: /bin/sh -c "python manage.py collectstatic --noinput && gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - ./secrets:/secrets:ro
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    build: ./nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/static
      - media:/media
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    restart: unless-stopped

  certbot:
    build: ./certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >
      "certbot certonly --webroot -w /var/www/certbot
      --email nbaishev@gmail.com --agree-tos --no-eff-email
      -d ustabim.online --keep-until-expiring &&
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"
    restart: unless-stopped

volumes:
  static:
  media:
  postgres:
  certbot-etc:
  certbot-var:
  certbot-www:
