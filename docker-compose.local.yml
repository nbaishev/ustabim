services:
  web:
    build: ./backend
    command: /bin/sh -c "python manage.py collectstatic --noinput && gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env.local
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      - db

  db:
    image: postgres:16
    env_file: .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.local
    depends_on:
      - web
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - static:/static
      - media:/media
      - frontend-build:/usr/share/nginx/html

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    env_file: .env.local
    volumes:
      - ./revit-academy-online:/frontend
      - frontend-build:/frontend/dist
    command: /bin/sh -c "npm install && npm run build && tail -f /dev/null"
    restart: unless-stopped

volumes:
  static:
  media:
  postgres:
  frontend-build:
